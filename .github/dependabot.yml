version: 2

# Groups mirror the peer-dependency clusters in package.json. Dependabot only
# applies peer resolution inside a single PR, so packages that pin each other
# (e.g. @vitest/ui peer-pins an exact vitest release) must land together or the
# PR fails `npm ci` with ERESOLVE.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # keep ^ranges tight instead of widening them on every lockfile bump
    versioning-strategy: increase-if-necessary
    groups:
      # eslint and every plugin peer-pin the eslint major. @typescript-eslint
      # also peer-pins typescript (>=4.8.4 <6.1.0 at 8.71.0), so typescript
      # has to move with them or a major bump resolves to an unbuildable tree.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"
          - "typescript"
          - "globals"
      # @vitest/ui peer-pins an exact vitest version - never split these.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Vite plugins peer-pin the vite major.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "workbox-*"
      # react-error-boundary and @testing-library/react peer on react/@types/react.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "react-error-boundary"
      # MUI and Emotion ship as a matched set.
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      # The devtools bundle must match the installed query-core version.
      tanstack:
        patterns:
          - "@tanstack/*"
      # Everything left in dependencies.
      production:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"
          - "typescript"
          - "globals"
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "workbox-*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "react-error-boundary"
          - "@mui/*"
          - "@emotion/*"
          - "@tanstack/*"
      # Everything left in devDependencies.
      dev-toolchain:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"
          - "typescript"
          - "globals"
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "workbox-*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "react-error-boundary"
          - "@mui/*"
          - "@emotion/*"
          - "@tanstack/*"
    # These six majors need source/config migration rather than a version bump,
    # so an automated PR would go red until that work is done by hand (see #37).
    # They are released deliberately instead of unattended.
    #
    # Expressed as `allow` + minor/patch rather than `ignore` + semver-major on
    # purpose. `ignore` suppresses security updates as well as version updates,
    # so a major-version security fix would never surface. `update-types` only
    # gates *version* updates - security updates are always raised regardless.
    # typescript is included for the same migration reason as the rest:
    # @typescript-eslint peer-caps it at <6.1.0 and has no TS 7 release, so a
    # 7.x bump cannot resolve at all.
    allow:
      - dependency-name: typescript
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: eslint
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: vite
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: vitest
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: react-error-boundary
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@sentry/react"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # Everything else stays fully automatic. This must stay last and is what
      # keeps the rules above from acting as a whitelist that silently drops
      # every other dependency's updates.
      - dependency-type: direct

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
