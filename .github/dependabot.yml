version: 2

# Groups mirror the peer-dependency clusters in package.json. Dependabot only
# applies peer resolution inside a single PR, so packages that pin each other
# (e.g. @vitest/ui peer-pins an exact vitest release) must land together or the
# PR fails `npm ci` with ERESOLVE.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # keep ^ranges tight instead of widening them on every lockfile bump
    versioning-strategy: increase-if-necessary
    groups:
      # eslint and every plugin peer-pin the eslint major. @typescript-eslint
      # also peer-pins typescript (>=4.8.4 <6.1.0 at 8.71.0), so typescript
      # has to move with them or a major bump resolves to an unbuildable tree.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"
          - "typescript"
          - "globals"
      # @vitest/ui peer-pins an exact vitest version - never split these.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Vite plugins peer-pin the vite major.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "workbox-*"
      # react-error-boundary and @testing-library/react peer on react/@types/react.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "react-error-boundary"
      # MUI and Emotion ship as a matched set.
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      # The devtools bundle must match the installed query-core version.
      tanstack:
        patterns:
          - "@tanstack/*"
      # Everything left in dependencies.
      production:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"
          - "typescript"
          - "globals"
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "workbox-*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "react-error-boundary"
          - "@mui/*"
          - "@emotion/*"
          - "@tanstack/*"
      # Everything left in devDependencies.
      dev-toolchain:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"
          - "typescript"
          - "globals"
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "workbox-*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "react-error-boundary"
          - "@mui/*"
          - "@emotion/*"
          - "@tanstack/*"
    # Major bumps are not offered for any direct dependency. Six of them -
    # typescript, eslint, vite, vitest, react-error-boundary, @sentry/react -
    # demonstrably cannot land unattended (see #37), and typescript 7.x cannot
    # resolve at all because @typescript-eslint peer-caps it at <6.1.0.
    # Applied to everything rather than as a six-package exception because
    # `allow` rules are a union: any matching rule permits the update, so a
    # trailing catch-all would re-permit majors for the exceptions too.
    #
    # This is deliberately `allow` + update-types and not `ignore` +
    # semver-major. `ignore` suppresses security updates as well as version
    # updates, so a security fix at any version would never be raised.
    # `update-types` gates version updates only - security updates are always
    # created regardless of this setting.
    allow:
      - dependency-type: direct
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
